<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Safari | LionGuard Safaris</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
<div class="container">

<div class="logo">
<img src="images/logo.png" alt="LionGuard Safaris">
<span>LionGuard Safaris</span>
</div>

<nav class="nav">
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="destinations.html">Destinations</a>
<a href="safaris.html">Safaris</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
<a href="book.html" class="book-btn">Book Safari</a>
</nav>

</div>
</header>

<!-- HERO SECTION -->
<section class="hero" style="
background:
linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
url('images/book-hero.jpg');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
">

<div class="hero-content">
<h1>Book Your Safari</h1>
<p>Enter your details below to plan an unforgettable adventure</p>
</div>

</section>

<!-- BOOKING FORM -->
<section class="booking-section">

<div class="booking-container">

<div class="booking-card">

<form class="booking-form">

<!-- Name and Email -->
<div class="form-row">
<div class="form-group">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name">
</div>
<div class="form-group">
<label>Email</label>
<input type="email" placeholder="Enter your email">
</div>
</div>

<!-- Phone and Guests -->
<div class="form-row">
<div class="form-group">
<label>Phone Number</label>
<input type="text" placeholder="+254">
</div>
<div class="form-group">
<label>Number of Guests</label>
<input type="number" placeholder="Number of people">
</div>
</div>

<!-- Destination and Package -->
<div class="form-row">
<div class="form-group">
<label>Safari Destination</label>
<select>
<option>Maasai Mara</option>
<option>Amboseli</option>
<option>Tsavo National Park</option>
<option>Lake Nakuru</option>
<option>Samburu</option>
</select>
</div>
<div class="form-group">
<label>Safari Package</label>
<select>
<option>3 Days Safari</option>
<option>5 Days Safari</option>
<option>7 Days Safari</option>
</select>
</div>
</div>

<!-- Dates -->
<div class="form-row">
<div class="form-group">
<label>Arrival Date</label>
<input type="date">
</div>
<div class="form-group">
<label>Departure Date</label>
<input type="date">
</div>
</div>

<!-- Special Requests -->
<div class="form-group">
<label>Special Requests</label>
<textarea placeholder="Write your message"></textarea>
</div>

<button type="submit" class="submit-btn">Send Booking Request</button>

</form>

</div> <!-- booking-card -->

</div> <!-- booking-container -->

</section>

<!-- FOOTER -->
<footer>
<p>© 2026 LionGuard Safaris | Kenya</p>
</footer>

</body>
</html>
