<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | LionGuard Safaris</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
<div class="container">

<div class="logo">
<img src="images/logo.png" alt="LionGuard Safaris">
<span>LionGuard Safaris</span>
</div>

<nav class="nav">
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="destinations.html">Destinations</a>
<a href="safaris.html">Safaris</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html" class="active">Contact</a>
<a href="book.html" class="book-btn">Book Safari</a>
</nav>

</div>
</header>

<!-- HERO -->
<section class="hero contact-hero">
<div class="hero-content">
<h1>Contact Us</h1>
<p>Reach out to us for any inquiries or support</p>
</div>
</section>

<!-- CONTACT SECTION -->
<section class="contact">

<div class="contact-container">

<div class="contact-card">

<form class="contact-form">

<div class="form-row">
<div class="form-group">
<label>Full Name</label>
<input type="text" placeholder="Enter your name">
</div>
<div class="form-group">
<label>Email</label>
<input type="email" placeholder="Enter your email">
</div>
</div>

<div class="form-row">
<div class="form-group">
<label>Phone Number</label>
<input type="text" placeholder="+254">
</div>
<div class="form-group">
<label>Subject</label>
<select>
<option>General Inquiry</option>
<option>Safari Question</option>
<option>Booking Help</option>
<option>Feedback</option>
</select>
</div>
</div>

<div class="form-group">
<label>Message</label>
<textarea placeholder="Write your message"></textarea>
</div>

<button type="submit" class="submit-btn">Send Message</button>

</form>

<div class="contact-info">
<h3>Other Ways to Reach Us</h3>
<p>Email: info@lionguardsafaris.com</p>
<p>Phone: +254 700 000000</p>
<p>Location: Nairobi, Kenya</p>
</div>

</div>

</div>

</section>

<!-- FOOTER -->
<footer>
<p>© 2026 LionGuard Safaris | Kenya</p>
</footer>

</body>
</html>
